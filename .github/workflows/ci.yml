name: Local milestone verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  systemd-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Real user-systemd lifecycle (offline fixture, not bot readiness)
        run: bash tests/run_systemd_ci.sh
      - name: Always clean disposable user manager
        if: always()
        run: bash tests/run_systemd_ci.sh --cleanup
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[test]'
      - run: mkdir -p .runtime
      - run: python -m pytest -q --basetemp=.runtime/pytest
      - run: discord-helper --config-dir "$PWD/.runtime/check/config" --data-dir "$PWD/.runtime/check/data" doctor
      - run: discord-helper --config-dir "$PWD/.runtime/check/config" --data-dir "$PWD/.runtime/check/data" run --check
      - run: python -m compileall -q helperbot
