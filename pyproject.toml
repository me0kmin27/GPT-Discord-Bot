[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-discord-helper"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["discord.py==2.7.1"]

[project.scripts]
discord-helper = "helperbot.manage:main"

[project.optional-dependencies]
web = ["Flask==3.1.3", "Flask-WTF==1.2.2", "waitress==3.0.2", "Werkzeug==3.1.9"]
test = ["pytest==8.4.2", "pytest-asyncio==1.2.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.package-data]
helperbot = ["web_templates/*.html", "web_static/*.css"]

[tool.setuptools.packages.find]
include = ["helperbot*"]
