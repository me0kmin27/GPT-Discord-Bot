{% extends 'base.html' %}{% from 'macros.html' import csrf with context %}{% block content %}<section class="card"><p class="eyebrow">CONFIRM RESTART</p><h1>봇을 재시작할까요?</h1><p>저장된 설정 <code>{{ config.revision[:12] }}</code>으로 고정 사용자 서비스 <code>discord-helper.service</code>의 재시작을 요청합니다.</p><p>진행 중인 요청이 중단될 수 있습니다. 저장하지 않은 양식 변경은 적용되지 않습니다.</p><form method="post">{{ csrf() }}<input type="hidden" name="revision" value="{{ config.revision }}"><label class="check"><input type="checkbox" name="confirm" value="restart" required> 중단 가능성을 확인했으며 재시작에 동의합니다.</label><div class="actions"><a href="/">취소</a><button type="submit">확인 후 재시작</button></div></form></section>{% endblock %}
